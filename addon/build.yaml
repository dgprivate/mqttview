# Base images for each architecture. The Home Assistant base image supplies the
# init system and bashio that an add-on is expected to have; mqttview's own
# binary is copied in from the project image, so the hardened build is the one
# that ships.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.21
  amd64: ghcr.io/home-assistant/amd64-base:3.21
  armv7: ghcr.io/home-assistant/armv7-base:3.21
args:
  # Pinned to an immutable tag, not :latest.
  #
  # With :latest the add-on's version says one thing and the binary inside says
  # another: Docker does not re-pull a tag it already has, so updating the
  # add-on rebuilt the wrapper around whatever mqttview happened to be cached.
  # An install reported version=b0ae61d while :latest was four commits further
  # on, and nothing anywhere said so.
  #
  # A digest rather than a tag, for the same reason the main Dockerfile pins
  # its base images that way: a tag is a name and a digest is the thing. This
  # is sha-ac0475c; the multi-arch index, so it resolves on amd64 and arm64
  # alike.
  #
  # Bump it with the app version. CI checks the digest is published and that
  # the Dockerfile default matches, so the two cannot drift.
  MQTTVIEW_IMAGE: hausbit/mqttview@sha256:f12447e838100ae6282ba3290ed98430514711488d5fcce1a4aa5e81c6b478f9
