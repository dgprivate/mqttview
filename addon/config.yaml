# Home Assistant add-on manifest.
#
# ingress: true is the whole point of this file. It means Home Assistant, not
# mqttview, decides who may open the panel, and that the panel appears in the
# sidebar rather than at a host and port somebody has to remember.
#
# There is deliberately no `ports:` entry. Publishing the port would put a
# second, unauthenticated door on the same server — mqttview refuses requests
# that did not come through the Supervisor, so it would be a door to a refusal
# page, but a port nobody needs is a port nobody should open.
name: mqttview
version: "0.1.4"
slug: mqttview
description: A realtime web UI for MQTT brokers, with Home Assistant discovery and a Beckhoff PLC panel
url: https://github.com/dgprivate/mqttview
arch:
  - aarch64
  - amd64
  - armv7
# No `image:` on purpose, for now.
#
# With one, Home Assistant pulls a prebuilt add-on image per architecture and
# refuses to install if it is missing — four images to publish and keep in step
# with the binary. Without one, it builds this add-on's small Dockerfile
# locally, which pulls hausbit/mqttview and adds the entrypoint. That is one
# image to publish, works on every architecture the base image supports, and
# costs a minute on first install.
#
# Add `image: hausbit/mqttview-addon-{arch}` once there is a workflow building
# those, and not before: an add-on that points at an image nobody published is
# an add-on nobody can install.

# The sidebar entry.
ingress: true
ingress_port: 8114
panel_icon: mdi:transit-connection-variant
panel_title: mqttview
panel_admin: false

init: false
startup: services

# /data is the add-on's own persistent directory; the database and the
# encryption key live there and survive an add-on update.
map:
  - addon_config:rw

# The Home Assistant MQTT integration's broker settings, so the add-on can
# offer to connect to the same broker without anybody typing it twice.
services:
  - mqtt:want

options:
  import_mqtt: true
  log_level: info
  default_role: operator
  admin_users: []
  fallback_user: ""
  frame_ancestors: []

schema:
  # Create a connection to the broker Home Assistant already uses, on first
  # start, if there is not one already. Only ever adds: a connection you have
  # edited is left alone.
  import_mqtt: bool?
  log_level: list(debug|info|warn|error)
  # What a Home Assistant user may do in mqttview on first sight. Home
  # Assistant does not tell an add-on whether somebody is one of its
  # administrators, so this cannot be inherited and has to be stated.
  default_role: list(viewer|operator|admin)
  # Home Assistant usernames or user IDs that get the admin role in mqttview.
  admin_users:
    - str?
  # Only for a Supervisor too old to send the identity headers. Everybody
  # shares one account when it is set, which is why it is empty by default.
  fallback_user: str?
  # Extra origins allowed to frame the UI. Ingress does not need this.
  frame_ancestors:
    - str?
