version: "2"

# What CI enforces, so it can be run locally with the same result:
#
#   golangci-lint run
#
# The set is deliberately small, and every exclusion below names why the linter
# is wrong about this code rather than switching it off for quiet. A linter that
# fires on style nobody agreed to gets silenced with nolint comments, and then
# the ones that matter get silenced with it.

linters:
  default: standard  # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # A leaked response body is a leaked connection, and this server holds many.
    - bodyclose
    # A shadowed or unwrapped err is a bug that reads like working code.
    - errorlint
    # This project talks to networks and disks; a swallowed error is a defect.
    - nilerr
    # SQL, crypto, TLS and file paths all live in here somewhere.
    - gosec
    - copyloopvar
    - prealloc
    # internal/store is hand-written database/sql. A Rows left open holds a
    # connection until the GC gets to it, and a Rows whose Err is never checked
    # reports a truncated result set as a complete one — the second is the
    # nastier of the two, because it looks like data.
    - sqlclosecheck
    - rowserrcheck
    # Every outbound request in here — OIDC discovery, SAML metadata, the MCP
    # client — must carry the caller's context, or a shutdown waits on a fetch
    # nobody can cancel.
    - noctx
    # A duration multiplied by a duration is nanoseconds squared, and compiles.
    - durationcheck
    # json.Marshal of a channel or a func returns an error nobody expects, and
    # the value silently becomes null.
    - errchkjson
    # append to a slice made with a length rather than a capacity leaves the
    # zero values in front of the data.
    - makezero
    - unconvert
    - wastedassign
    # Comments are read more than the code around them.
    - misspell

  settings:
    gosec:
      excludes:
        # G115 integer conversion: the two sites are bounded before the cast —
        # KeepAlive is validated against 65535 in ConnectionSpec.Normalize, and
        # the argon2 length is a hash size this code chose itself.
        - G115
        # G304 file inclusion by variable: reading the config file and the
        # encryption key from operator-supplied paths is the point of those
        # settings. There is no untrusted input in either path.
        - G304
        # G402 InsecureSkipVerify: opt-in per connection, marked in the UI and
        # documented in SECURITY.md. Home brokers with self-signed certificates
        # are the reason it exists.
        - G402
        # G710 open redirect: the SSO "next" parameter goes through
        # sanitizeNext, which rejects anything not beginning with a single "/".
        # The taint analysis cannot see through the signed-state round trip.
        - G710
        # G124 cookie attributes: the session cookie sets HttpOnly, SameSite
        # and Secure (from base_url); the CSRF cookie is readable by script on
        # purpose, because double-submit requires the SPA to echo it back.
        - G124
        # G118 background context in a goroutine: the reconnect supervisor and
        # the autopaho connection manager have to outlive the request that
        # started them, which is the documented reason they take their own.
        - G118
    staticcheck:
      checks: ["all"]
    misspell:
      ignore-rules:
        # The broker is spelled Mosquitto. misspell's dictionary reads it as a
        # typo for the insect.
        - mosquitto
        # A deliberately mistyped field in internal/httpx/json_test.go, which
        # is what DisallowUnknownFields is being tested with.
        - nmae

  exclusions:
    rules:
      # noctx on database/sql: internal/store takes no context, so every query
      # here is flagged. Threading one through would mean a cancelled request
      # cancels its query — worth real money against a network database, and
      # close to nothing against a local SQLite file where a query is measured
      # in microseconds. It is excluded here rather than repo-wide because the
      # linter's actual value is outbound HTTP: OIDC discovery, SAML metadata,
      # the MCP client, all of which do carry a context and must keep doing so.
      - path: internal/store/
        linters: [noctx]
      # The test broker binds a port to find a free one and to check the
      # broker took it. There is no request to cancel.
      - path: internal/testutil/
        linters: [noctx]
      # G705 XSS taint: serveIndex writes index.html with the base href
      # rewritten from X-Ingress-Path. The taint analysis sees a header
      # reaching a Write and stops there; it cannot see the two things that
      # make it safe, both of which have tests:
      #
      #   * auth.IngressPath admits only ^(/[A-Za-z0-9._~-]+)+/?$ — no quote,
      #     angle bracket or ampersand can survive it — and returns "" outside
      #     ingress mode, where nothing has vouched for the header;
      #   * withBase escapes the value again with template.HTMLEscapeString.
      #
      # See TestIngressPathIsConstrainedToSomethingThatCanOnlyBeAPath and
      # TestTheIngressPrefixIsIgnoredInStandaloneMode.
      - path: internal/api/spa\.go
        text: 'G705'
        linters: [gosec]
      # Tests set up adversarial conditions on purpose, and a response body in
      # a test dies with the test.
      #
      # noctx is here for the same reason it is not switched off globally: its
      # value is catching a context-less outbound request in the server, and it
      # found none — every HTTP call in cmd/ and internal/ already carries one.
      # A request in a test is bounded by `go test -timeout` and dies with the
      # binary, so threading a context through fifty call sites would buy
      # nothing. If it ever fires outside a test, that is the case it is for.
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose, prealloc, errchkjson, noctx]
      # A deferred Close on a read path has nothing to report and nowhere to
      # report it; the write paths check theirs.
      - source: 'defer .*\.Close\(\)'
        linters: [errcheck]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
