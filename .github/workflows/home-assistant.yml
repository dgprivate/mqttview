# Validation for the two Home Assistant delivery paths.
#
# Both are easy to get subtly wrong in ways that only show up when somebody
# tries to install them, which is the worst place to find out: hassfest checks
# the integration's manifest and translations, and the add-on linter checks the
# add-on's manifest and Dockerfile.
name: Home Assistant

on:
  push:
    branches: [main]
    paths:
      - 'addon/**'
      - 'repository.yaml'
      - 'custom_components/**'
      - 'hacs.json'
      - '.github/workflows/home-assistant.yml'
  pull_request:
    paths:
      - 'addon/**'
      - 'repository.yaml'
      - 'custom_components/**'
      - 'hacs.json'
      - '.github/workflows/home-assistant.yml'
  schedule:
    # Both linters change under us, so a weekly run finds a break before a
    # release does.
    - cron: '0 5 * * 1'
  # Runnable by hand: the path filters above mean a change to the Go server
  # does not trigger this, and a release still wants to know both linters are
  # happy before anybody tries to install it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Integration manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: hacs/action@main
        with:
          category: integration
          # Brand assets live in the home-assistant/brands repository and are
          # added by pull request there, which cannot be done from here.
          ignore: brands

  addon:
    name: App (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [addon, addon-hassconfig]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint the add-on
        uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.app }}

      - name: Check the run script
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck ${{ matrix.app }}/run.sh

      - name: The two apps differ only where they are meant to
        run: |
          # They are the same app with different permissions. Anything else
          # drifting between them is a bug that will be found by one person
          # having a feature the other does not.
          set -euo pipefail
          for f in Dockerfile run.sh build.yaml translations/en.yaml; do
            diff -q "addon/${f}" "addon-hassconfig/${f}"
          done
          echo "the shared files are identical"

          python3 - <<'PY'
          import yaml
          a = yaml.safe_load(open("addon/config.yaml"))
          b = yaml.safe_load(open("addon-hassconfig/config.yaml"))
          differ = {k for k in set(a) | set(b) if a.get(k) != b.get(k)}
          allowed = {"name", "slug", "description", "map"}
          extra = differ - allowed
          assert not extra, f"the manifests differ in {sorted(extra)}, which is more than permissions"
          assert differ, "the manifests are identical, so one of them grants nothing extra"
          print("the manifests differ only in", sorted(differ))
          PY

      - name: The pinned mqttview image exists
        run: |
          # The app pins the binary it wraps by tag. A pin to something that
          # was never published is an app that fails to build on somebody's
          # Home Assistant, at install time, with a Docker error.
          set -euo pipefail
          image=$(grep -oP 'MQTTVIEW_IMAGE: \K\S+' ${{ matrix.app }}/build.yaml)
          echo "pinned to ${image}"
          docker manifest inspect "${image}" > /dev/null
          echo "the pinned image is published"

          # And it has to be the same one the Dockerfile defaults to, or a
          # local build and a Supervisor build produce different binaries.
          default=$(grep -oP 'ARG MQTTVIEW_IMAGE=\K\S+' ${{ matrix.app }}/Dockerfile)
          [ "${image}" = "${default}" ] || {
            echo "build.yaml pins ${image} but the Dockerfile defaults to ${default}"
            exit 1
          }
          echo "the Dockerfile default matches"

      - name: The layout the Supervisor requires
        run: |
          # frenck's linter checks the manifest; nothing checks where it sits.
          # The Supervisor reads repository.yaml from the root and each app from
          # a directory beside it, and says only "is not a valid app repository"
          # when that is wrong — which cost an evening to work out once.
          set -euo pipefail
          test -f repository.yaml || { echo "repository.yaml must be in the root"; exit 1; }
          test -f ${{ matrix.app }}/config.yaml || { echo "${{ matrix.app }}/config.yaml is missing"; exit 1; }
          echo "repository.yaml in the root, ${{ matrix.app }}/config.yaml beside it"

      - name: The options the add-on writes are a configuration mqttview accepts
        run: |
          # The add-on's whole job is turning options.json into mqttview's
          # config. A mapping that produces something the server refuses is a
          # broken add-on, and this is the only place the two meet.
          set -euo pipefail
          sudo mkdir -p /data
          echo '{"log_level":"info","default_role":"operator",
                 "admin_users":["someone"],"fallback_user":"",
                 "frame_ancestors":[]}' | sudo tee /data/options.json > /dev/null

          sed 's|^exec .*||; s|^ *-config.*||; s|^ *-log-level.*||' \
            ${{ matrix.app }}/run.sh | sudo bash

          go run ./cmd/mqttview -config /data/mqttview.yaml -check-config
