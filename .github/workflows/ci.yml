name: CI

# Every action is pinned to a commit SHA with the version it was at in a
# comment. A tag is mutable and a compromised action runs with this workflow's
# token; Renovate moves the SHA and keeps the comment in step.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nothing changes in the repository overnight, but the vulnerability
    # databases behind govulncheck and npm audit do.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: read-all  # Jobs that need more ask for it themselves

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The tests start a real in-process MQTT broker, so the race detector is
      # worth the extra minute here.
      - name: Test
        run: go test -race -timeout 5m ./...

      # A floor rather than a target. It exists so coverage cannot quietly rot:
      # a change that deletes tests fails here instead of being noticed months
      # later. Raise it when the number rises; never lower it to make a build
      # pass.
      - name: Coverage
        run: |
          go test -coverpkg=./internal/...,./cmd/... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          floor=50.0
          echo "total ${total}%, floor ${floor}%"
          awk -v t="$total" -v f="$floor" 'BEGIN { if (t+0 < f+0) { print "coverage fell below the floor"; exit 1 } }'

      - name: Keep the coverage profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.13.1

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck reports only the advisories whose vulnerable symbol this
      # code actually reaches, so a finding here is worth acting on rather than
      # triaging away.
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm audit
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - run: npm run build

  build:
    name: Build binary
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build everything
        run: make build

      - name: Smoke test the binary
        run: ./mqttview -version

  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: mqttview:ci
          build-args: |
            VERSION=ci
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The claims in security/README.md are checked here, so that a change
      # that quietly undoes one of them fails the build rather than the audit.
      - name: Check the image is hardened
        run: |
          set -eu
          run() { docker run --rm --entrypoint /bin/sh mqttview:ci -c "$1"; }

          echo "unprivileged user"
          test "$(run 'id -u')" = "10001"

          echo "no package manager"
          if run 'command -v apk' >/dev/null 2>&1; then
            echo "apk is still in the image"; exit 1
          fi

          echo "the package database survived, or scanners are blind"
          run 'test -s /lib/apk/db/installed'

          echo "no setuid or setgid binaries"
          test "$(run 'find / -xdev -perm /6000 -type f 2>/dev/null | wc -l')" = "0"

          echo "an SBOM of itself"
          run 'test -s /usr/share/mqttview/sbom.cdx.json'

      - name: Start the container
        run: |
          docker run -d --name mqttview \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            -p 8114:8114 \
            -e MQTTVIEW_BASE_URL=http://127.0.0.1:8114 \
            -e MQTTVIEW_BOOTSTRAP_PASSWORD=ci-smoke-test-password \
            mqttview:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8114/api/health > /dev/null; then
              echo "healthy after ${i}s"
              curl -sS http://127.0.0.1:8114/api/health
              exit 0
            fi
            sleep 1
          done

          echo "container never became healthy"
          docker logs mqttview
          exit 1

      - name: Check the embedded frontend is served
        run: curl -fsS http://127.0.0.1:8114/ | grep -q '<div id="root">'

      - name: Stop the container
        if: always()
        run: docker rm -f mqttview || true

  compose:
    name: Compose stack
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      # Exercises the demo profile, which is also the multi-broker smoke test.
      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i "s/^MQTTVIEW_SECRET_KEY=.*/MQTTVIEW_SECRET_KEY=$(openssl rand -hex 32)/" .env
          sed -i "s/^MQTTVIEW_BOOTSTRAP_PASSWORD=.*/MQTTVIEW_BOOTSTRAP_PASSWORD=ci-smoke-test-password/" .env
          docker compose --profile demo up -d --build --wait --wait-timeout 180

      - name: Check the runtime restrictions were applied
        run: |
          set -eu
          fmt='{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}} {{.HostConfig.PidsLimit}}'
          got=$(docker inspect mqttview --format "$fmt")
          echo "$got"
          test "$got" = "true [ALL] 256"

      - name: Show what is running
        if: always()
        run: docker compose ps

      - name: Tear down
        if: always()
        run: docker compose --profile demo down -v
